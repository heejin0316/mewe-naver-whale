name: 제출본 검증

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: 기능 시험
        run: npm test
      - name: 소스·문서·개인정보 일치
        run: npm run check
      - name: 제출 ZIP·이미지·해시 확인
        shell: pwsh
        run: ./scripts/check-delivery.ps1
